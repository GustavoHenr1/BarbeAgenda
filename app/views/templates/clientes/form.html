{% extends "base.html" %}
{% block titulo %}{{ 'Editar' if id_cliente else 'Novo' }} cliente{% endblock %}
{% block conteudo %}
<div class="cabecalho">
  <div><p class="sobretitulo"><a href="{{ url_for('clientes.listar') }}">← Clientes</a></p><h1>{{ 'Editar' if id_cliente else 'Novo' }} cliente</h1></div>
</div>
<form method="post" class="cartao formulario">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label class="campo"><span>Nome completo *</span>
    <input type="text" name="nome" required maxlength="100" value="{{ cliente.nome or '' }}" autofocus></label>
  <div class="grade-2">
    <label class="campo"><span>Telefone (WhatsApp) *</span>
      <input type="tel" name="telefone" required data-mascara-telefone placeholder="(11) 91234-5678" value="{{ cliente.telefone or '' }}"></label>
    <label class="campo"><span>E-mail *</span>
      <input type="email" name="email" required maxlength="120" placeholder="nome@exemplo.com" value="{{ cliente.email or '' }}"></label>
  </div>
  <div class="rodape-form">
    <a class="btn" href="{{ url_for('clientes.listar') }}">Voltar</a>
    <button class="btn btn-primario" type="submit">Salvar cliente</button>
  </div>
</form>
{% endblock %}
