{% extends "base.html" %}
{% block titulo %}{{ 'Editar' if id_servico else 'Novo' }} serviço{% endblock %}
{% block conteudo %}
<div class="cabecalho">
  <div><p class="sobretitulo"><a href="{{ url_for('servicos.listar') }}">← Serviços</a></p><h1>{{ 'Editar' if id_servico else 'Novo' }} serviço</h1></div>
</div>
<form method="post" class="cartao formulario">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label class="campo"><span>Nome do serviço *</span>
    <input type="text" name="nome" required maxlength="80" value="{{ servico.nome or '' }}" autofocus></label>
  <label class="campo"><span>Descrição</span>
    <input type="text" name="descricao" maxlength="255" value="{{ servico.descricao or '' }}"></label>
  <div class="grade-2">
    <label class="campo"><span>Preço (R$) *</span>
      <input type="text" name="preco" required inputmode="decimal" placeholder="40,00"
             value="{% if servico.preco is string %}{{ servico.preco }}{% elif servico.preco is defined and servico.preco is not none %}{{ ('%.2f'|format(servico.preco|float)).replace('.', ',') }}{% endif %}"></label>
    <label class="campo"><span>Duração (minutos) *</span>
      <input type="number" name="duracao_min" required min="5" max="480" step="5" value="{{ servico.duracao_min or 30 }}"></label>
  </div>
  <div class="rodape-form">
    <a class="btn" href="{{ url_for('servicos.listar') }}">Voltar</a>
    <button class="btn btn-primario" type="submit">Salvar serviço</button>
  </div>
</form>
{% endblock %}
