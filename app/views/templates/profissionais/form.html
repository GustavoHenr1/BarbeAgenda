{% extends "base.html" %}
{% block titulo %}{{ 'Editar' if id_profissional else 'Novo' }} profissional{% endblock %}
{% block conteudo %}
<div class="cabecalho">
  <div><p class="sobretitulo"><a href="{{ url_for('profissionais.listar') }}">← Profissionais</a></p><h1>{{ 'Editar' if id_profissional else 'Novo' }} profissional</h1></div>
</div>
<form method="post" class="cartao formulario">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label class="campo"><span>Nome *</span>
    <input type="text" name="nome" required maxlength="100" value="{{ prof.nome or '' }}" autofocus></label>
  <label class="campo"><span>E-mail *</span>
    <input type="email" name="email" required maxlength="120" placeholder="nome@exemplo.com" value="{{ prof.email or '' }}"></label>
  <div class="grade-2">
    <label class="campo"><span>Especialidade</span>
      <input type="text" name="especialidade" maxlength="100" placeholder="Ex.: degradê, barba" value="{{ prof.especialidade or '' }}"></label>
    <label class="campo"><span>Telefone</span>
      <input type="tel" name="telefone" data-mascara-telefone placeholder="(11) 91234-5678" value="{{ prof.telefone or '' }}"></label>
  </div>
  <label class="check">
    <input type="checkbox" name="ativo" value="1" {{ 'checked' if prof.ativo and prof.ativo != '0' }}>
    <span>Ativo (pode receber novos agendamentos)</span>
  </label>
  <div class="rodape-form">
    <a class="btn" href="{{ url_for('profissionais.listar') }}">Voltar</a>
    <button class="btn btn-primario" type="submit">Salvar profissional</button>
  </div>
</form>
{% endblock %}
