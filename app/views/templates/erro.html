{% extends "base.html" %}
{% block titulo %}Erro {{ codigo }}{% endblock %}
{% macro corpo() %}
  <div class="vazio">
    <h1>Erro {{ codigo }}</h1>
    <p>{{ mensagem }}</p>
    <a class="btn btn-primario" href="{{ url_for('dashboard.index') }}">Voltar ao início</a>
  </div>
{% endmacro %}
{% block conteudo %}{{ corpo() }}{% endblock %}
{% block publico %}<div class="login-pagina"><div class="login-form-area">{{ corpo() }}</div></div>{% endblock %}
